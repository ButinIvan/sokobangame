<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#182326">
  <title>Склад 17 — Sokoban</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">17</span>
        <div>
          <h1>Склад 17</h1>
          <p>Sokoban</p>
        </div>
      </div>

      <div class="stats" aria-label="Статистика игры">
        <div class="stat"><span>Уровень</span><strong id="level-value">1 / 5</strong></div>
        <div class="stat"><span>Ходы</span><strong id="moves-value">0</strong></div>
        <div class="stat"><span>Ящики</span><strong id="boxes-value">0 / 0</strong></div>
      </div>

      <div class="actions">
        <button id="undo-button" class="icon-button" type="button" title="Отменить ход (Z)" aria-label="Отменить ход">&#8630;</button>
        <button id="restart-button" class="icon-button" type="button" title="Начать уровень заново (R)" aria-label="Начать уровень заново">&#8635;</button>
        <button id="sound-button" class="icon-button" type="button" title="Выключить звук" aria-label="Выключить звук">&#9835;</button>
      </div>
    </header>

    <section class="play-area">
      <aside class="level-panel" aria-label="Выбор уровня">
        <p class="panel-label">СЕКТОРЫ</p>
        <nav id="level-list" class="level-list"></nav>
        <div class="legend">
          <p><i class="legend-goal"></i>Место для ящика</p>
          <p><i class="legend-box"></i>Груз</p>
        </div>
      </aside>

      <div class="board-stage">
        <div id="board" class="board" role="grid" aria-label="Игровое поле Sokoban"></div>
        <p id="hint" class="hint">Доставьте все ящики на отмеченные места</p>
      </div>

      <aside class="control-panel">
        <p class="panel-label">УПРАВЛЕНИЕ</p>
        <div class="key-guide" aria-hidden="true">
          <span></span><kbd>&uarr;</kbd><span></span>
          <kbd>&larr;</kbd><kbd>&darr;</kbd><kbd>&rarr;</kbd>
        </div>
        <p>Стрелки или WASD</p>
        <div class="mobile-controls" aria-label="Экранное управление">
          <span></span><button data-direction="up" aria-label="Вверх">&uarr;</button><span></span>
          <button data-direction="left" aria-label="Влево">&larr;</button>
          <button data-direction="down" aria-label="Вниз">&darr;</button>
          <button data-direction="right" aria-label="Вправо">&rarr;</button>
        </div>
        <div class="shortcut"><kbd>Z</kbd><span>Отменить ход</span></div>
        <div class="shortcut"><kbd>R</kbd><span>Начать заново</span></div>
      </aside>
    </section>
  </main>

  <dialog id="win-dialog" class="win-dialog">
    <div class="win-icon" aria-hidden="true">&#10003;</div>
    <p class="eyebrow">СЕКТОР ОЧИЩЕН</p>
    <h2>Отличная работа!</h2>
    <p id="win-summary">Все ящики на местах.</p>
    <button id="next-button" class="primary-button" type="button">Следующий уровень <span>&rarr;</span></button>
    <button id="replay-button" class="text-button" type="button">Пройти ещё раз</button>
  </dialog>

  <script src="game.js"></script>
</body>
</html>
